name: Build 3DS homebrew

on:
  push:
    branches: [main]
    paths:
      - "ports/3ds/**"
      - "src/assets/img/**"
      - ".github/workflows/3ds.yml"
  pull_request:
    paths:
      - "ports/3ds/**"
      - "src/assets/img/**"
      - ".github/workflows/3ds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          echo "DEVKITPRO=$DEVKITPRO DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version | head -1
          which 3dsxtool tex3ds smdhtool

      - name: Build
        run: make -C ports/3ds -j"$(nproc)"

      - name: Show artifacts
        run: ls -lh ports/3ds/popbomb-arena.3dsx ports/3ds/popbomb-arena.elf

      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-build
          path: |
            ports/3ds/popbomb-arena.3dsx
            ports/3ds/popbomb-arena.elf
            ports/3ds/romfs
          if-no-files-found: error

  package:
    needs: build
    # makerom/bannertool only run on the host: the devkitPro image ships an
    # older glibc than their release binaries require.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3ds-build
          path: ports/3ds

      - name: Install packaging tools
        id: tools
        continue-on-error: true
        run: |
          set -e
          exec > >(tee /tmp/tools.log) 2>&1
          trap 'status=$?; { echo "### Packaging tools log"; echo "```"; tail -30 /tmp/tools.log; echo "```"; } >> "$GITHUB_STEP_SUMMARY"; exit $status' EXIT
          fetch() { curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors "$1" -o "$2"; }

          # Prebuilt binaries first. GitHub's release CDN has been returning
          # 504 for these for hours at a time, so fall back to building the
          # tools from their source tarballs, which are served by codeload.
          if fetch https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip /tmp/makerom.zip; then
            unzip -o -j /tmp/makerom.zip makerom -d /tmp/makerom
            sudo install -m 755 /tmp/makerom/makerom /usr/local/bin/makerom
          else
            echo "makerom download failed; building from source"
            fetch https://codeload.github.com/3DSGuy/Project_CTR/tar.gz/refs/tags/makerom-v0.18.4 /tmp/project_ctr.tar.gz
            tar xzf /tmp/project_ctr.tar.gz -C /tmp
            make -C /tmp/Project_CTR-makerom-v0.18.4/makerom deps -j"$(nproc)"
            make -C /tmp/Project_CTR-makerom-v0.18.4/makerom -j"$(nproc)"
            sudo install -m 755 /tmp/Project_CTR-makerom-v0.18.4/makerom/makerom /usr/local/bin/makerom
          fi

          if fetch https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz /tmp/bannertool.tar.gz; then
            mkdir -p /tmp/bannertool
            tar xzf /tmp/bannertool.tar.gz -C /tmp/bannertool --strip-components=1
            sudo install -m 755 /tmp/bannertool/bannertool /usr/local/bin/bannertool
          else
            echo "bannertool download failed; building from source"
            fetch https://codeload.github.com/carstene1ns/3ds-bannertool/tar.gz/refs/tags/1.2.3 /tmp/bannertool.tar.gz
            tar xzf /tmp/bannertool.tar.gz -C /tmp
            cmake -S /tmp/3ds-bannertool-1.2.3 -B /tmp/bannertool-build -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/bannertool-build -j"$(nproc)"
            sudo install -m 755 /tmp/bannertool-build/bannertool /usr/local/bin/bannertool
          fi

          makerom -v 2>&1 | head -2 || true
          bannertool 2>&1 | head -2 || true

      - name: Prepare banner audio
        if: steps.tools.outcome == 'success'
        working-directory: ports/3ds
        run: |
          python3 - <<'EOF'
          import wave
          src = wave.open("romfs/audio/menu.wav", "rb")
          out = wave.open("/tmp/banner.wav", "wb")
          out.setnchannels(src.getnchannels())
          out.setsampwidth(src.getsampwidth())
          out.setframerate(src.getframerate())
          out.writeframes(src.readframes(min(src.getnframes(), src.getframerate() * 4)))
          out.close()
          src.close()
          EOF

      - name: Build SMDH icon
        if: steps.tools.outcome == 'success'
        working-directory: ports/3ds
        run: |
          bannertool makesmdh -s "泡泡堂 大乱斗" -scs "泡泡堂 大乱斗" \
            -l "Q版泡泡堂 3DS 移植版" -p wubin1998 \
            -i cia/icon.png -o popbomb-arena.icn

      - name: Build banner
        if: steps.tools.outcome == 'success'
        working-directory: ports/3ds
        run: |
          bannertool makebanner -i cia/banner.png -a /tmp/banner.wav -o popbomb-arena.bnr

      - name: Build CIA
        if: steps.tools.outcome == 'success'
        working-directory: ports/3ds
        run: |
          makerom -f cia -o popbomb-arena.cia -elf popbomb-arena.elf -rsf app.rsf \
            -icon popbomb-arena.icn -banner popbomb-arena.bnr -exefslogo -target t
          ls -lh popbomb-arena.cia

      - uses: actions/upload-artifact@v4
        with:
          name: popbomb-arena-3ds
          path: |
            ports/3ds/popbomb-arena.3dsx
            ports/3ds/popbomb-arena.cia
          if-no-files-found: error

      - name: Collect release files
        id: assets
        run: |
          files="ports/3ds/popbomb-arena.3dsx"
          if [ -f ports/3ds/popbomb-arena.cia ]; then
            files="$files"$'\n'"ports/3ds/popbomb-arena.cia"
          fi
          printf 'files<<EOF\n%s\nEOF\n' "$files" >> "$GITHUB_OUTPUT"

      - name: Publish latest 3DS build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 3ds-latest
          name: PopBomb Arena — 3DS (latest)
          body: |
            Automated homebrew build from ${{ github.sha }}.

            - `popbomb-arena.cia` — install with FBI (`Remote Install` or copy
              to the SD card and pick *Install CIA*). It appears on the Home
              Menu with its own icon and banner.
            - `popbomb-arena.3dsx` — copy to `/3ds/popbomb-arena.3dsx` and
              launch from the Homebrew Launcher.

            Press START on the title screen to quit.
          prerelease: true
          files: ${{ steps.assets.outputs.files }}
