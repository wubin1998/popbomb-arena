name: Build R36S port

# The port reuses ports/3ds/source, so changes there (or to the shared gfx and
# audio data) rebuild it too. Ubuntu focal keeps the binary's glibc floor at
# 2.31, which EmuELEC/ArkOS images on RK3326 satisfy.
on:
  push:
    branches: [main]
    paths:
      - "ports/sdl/**"
      - "ports/r36s/**"
      - "ports/3ds/source/**"
      - "ports/3ds/gfx/**"
      - "ports/3ds/romfs/audio/**"
      - ".github/workflows/r36s.yml"
  pull_request:
    paths:
      - "ports/sdl/**"
      - "ports/r36s/**"
      - "ports/3ds/source/**"
      - "ports/3ds/gfx/**"
      - "ports/3ds/romfs/audio/**"
      - ".github/workflows/r36s.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL_VERSION: 2.32.4

jobs:
  build:
    # Native aarch64 runner, so SDL2 and the game build without a cross sysroot.
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # CI logs need a login to read; failures are re-emitted as annotations,
      # which the public API serves without one.
      - name: Install build dependencies
        run: |
          if ! (
            set -eux
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake curl ca-certificates file zip \
              libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
              libasound2-dev libudev-dev
          ) 2>&1 | tee /tmp/deps.log; then
            tail -n 15 /tmp/deps.log | sed 's/^/::error::/'
            exit 1
          fi

      # Both SDL2 and the game install/consume a prefix inside the checkout:
      # a container job's steps do not share /tmp or /usr/local.
      - name: Build SDL2
        run: |
          bash ports/r36s/ci/with_log.sh sdl2 ports/r36s/ci/build_sdl2.sh \
            "$GITHUB_WORKSPACE/_deps/sdlroot" "$SDL_VERSION" \
            "$GITHUB_WORKSPACE/_deps/sdl2"

      - name: Build the game
        run: |
          bash ports/r36s/ci/with_log.sh game ports/r36s/ci/build_game.sh \
            "$GITHUB_WORKSPACE/_deps/sdlroot"

      # CI logs need auth; this artifact is readable without it when a step fails.
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p build
          {
            echo "## env"; echo "workspace=$GITHUB_WORKSPACE runner_temp=$RUNNER_TEMP"
            echo "PATH=$PATH"
            echo "## pwd"; pwd; ls -la
            echo "## deps"; ls -la _deps 2>&1; ls -la _deps/sdlroot 2>&1
            echo "## sdls"; find / -name 'SDL.h' -not -path '*/sdl2-build/*' 2>/dev/null | head -20
            echo "## tools"; command -v cc cmake sdl2-config; cc --version 2>&1 | head -2
            echo "## tmp"; ls -la /tmp
          } > build/diag.txt 2>&1 || true
          cat build/diag.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r36s-diag
          path: build/diag.txt
          if-no-files-found: ignore

      - name: Smoke test (headless)
        run: |
          bash ports/r36s/ci/with_log.sh smoke ports/r36s/ci/smoke_test.sh \
            "$GITHUB_WORKSPACE/_deps/sdlroot"

      - name: Assemble the port
        run: |
          bash ports/r36s/ci/with_log.sh assemble ports/r36s/ci/assemble_port.sh \
            "$GITHUB_WORKSPACE/_deps/sdlroot"

      - uses: actions/upload-artifact@v4
        with:
          name: r36s-port
          path: build/popbomb.zip
          if-no-files-found: error

      - name: Publish rolling R36S build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r36s-latest
          name: PopBomb Arena — R36S (latest)
          body: |
            Automated aarch64 build from ${{ github.sha }}.

            解压 `popbomb.zip` 到 SD 卡的 `/roms/ports/`，从 Ports 菜单启动。

            - 方向键 / 左摇杆移动，A/X 放炸弹，START 暂停，B/Y 重开本关，SELECT 退出。
            - 自带 SDL2（KMSDRM + GLES，无 X11 依赖），面向 EmuELEC / ArkOS 的 RK3326 掌机。
            - 真机若黑屏或没声音，把 `popbomb/log.txt` 发出来即可定位。
          prerelease: true
          files: build/popbomb.zip
